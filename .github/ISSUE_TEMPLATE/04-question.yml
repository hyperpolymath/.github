name: ❓ Question
description: Ask about usage or behaviour. (Prefer Discussions for open-ended chat.)
title: "[Question]: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For broad or open-ended conversations, the **Discussions** tab of this
        repository is usually a better home. Use this template when you want a
        tracked answer to a specific question.

  - type: textarea
    id: question
    attributes:
      label: Your question
      placeholder: "How do I...?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to achieve, and what have you tried?
      placeholder: "I'm trying to X. I've read the README and tried Y, but..."
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. v1.2.3, main@HEAD"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I read the available documentation.
          required: true
