# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Calls the estate secret-scanner bundle (gitleaks + rust-secrets +
# shell-secrets) through a local vendored reusable workflow.
#
# Why local: Secret Scanner run 41543261728 failed at startup because this
# repository's Actions allowlist rejects reusable workflows that are not from
# a hyperpolymath-owned repository. The canonical coordinate
# metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@8d1a2aab...
# is therefore blocked here, and GitHub Actions does not follow the REST
# redirect from the pre-transfer hyperpolymath/standards slug. The local copy
# in secret-scanner-reusable.yml preserves the canonical scanner at that
# standards SHA while remaining inside the allowlist.
#
# The reusable declares no workflow_call secrets and references no secrets.*
# context. Do not add `secrets: inherit`: it would forward every repository
# and organisation secret to a scanner that needs none.

name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scanner-reusable.yml
