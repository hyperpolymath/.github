# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets).
#
# The reusable lives in metadatastician/standards. GitHub Actions does not
# follow the REST redirect from the pre-transfer hyperpolymath/standards slug
# for job-level `uses:`, so the old coordinate produced a zero-job startup
# failure and no `scan / gitleaks` check. Keep the canonical slug and an
# immutable 40-hex pin.
#
# The pinned reusable declares no workflow_call secrets and references no
# `secrets.*` context. Do not add `secrets: inherit`: it would forward every
# repository/organisation secret to a scanner that needs none.

name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@8d1a2aab4211493cf42f147f2080f024605797dc
